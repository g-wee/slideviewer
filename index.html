<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Institutional Slide Viewer Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
        body { margin: 0; display: flex; font-family: Arial, sans-serif; height: 100vh; }
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 15px; box-sizing: border-box; }
        #sidebar h3 { margin-top: 0; color: #ecf0f1; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        #viewer-container { flex-grow: 1; background: #111; position: relative; }
        #openseadragon-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Slide List</h3>
        <p style="color: #00ffcc; font-weight: bold;">● Slide 0055 (Active)</p>
        <p style="color: #bdc3c7; font-size: 0.9em;">Zeiss CZI Converted Test</p>
    </div>

    <div id="viewer-container">
        <div id="openseadragon-viewer"></div>
    </div>

    <script>
        // Initialize OpenSeadragon pointing directly to your local deep-zoom assets
        var viewer = OpenSeadragon({
            id: "openseadragon-viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
            showNavigator: true, 
            animationTime: 0.5,
            blendingTime: 0.1,
            constrainDuringPan: true,
            tileSources: "slide_0055.dzi" // Points directly to the local metadata file generated by libvips
        });
    </script>
</body>
</html>
