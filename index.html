<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Institutional Slide Viewer Portal</title>
    <!-- Load the free OpenSeadragon library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; display: flex; font-family: Arial, sans-serif; height: 100vh; }
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 15px; overflow-y: auto; }
        #sidebar h3 { margin-top: 0; color: #ecf0f1; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .slide-link { display: block; padding: 10px; margin: 5px 0; color: #bdc3c7; text-decoration: none; cursor: pointer; border-radius: 4px; }
        .slide-link:hover { background: #34495e; color: white; }
        #viewer-container { flex-grow: 1; background: #111; position: relative; }
        #openseadragon-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- Slide Selection Sidebar Menu -->
    <div id="sidebar">
        <h3>Slide List (400)</h3>
        <a class="slide-link" onclick="loadSlide('https://dropboxusercontent.com')">Slide 001 - Lung Tissue</a>
        <a class="slide-link" onclick="loadSlide('https://dropboxusercontent.com')">Slide 002 - Kidney Tissue</a>
        <!-- Add more rows for your slides here -->
    </div>

    <!-- Interactive Deep-Zoom Map Viewer -->
    <div id="viewer-container">
        <div id="openseadragon-viewer"></div>
    </div>

    <script>
        // Initialize the viewer engine
        var viewer = OpenSeadragon({
            id: "openseadragon-viewer",
            prefixUrl: "https://cloudflare.com",
            showNavigator: true, // Small radar map in the corner
            animationTime: 0.5,
            blendingTime: 0.1,
            constrainDuringPan: true
        });

        // Function to stream the chosen slide without reloading the browser
        function loadSlide(fileUrl) {
            viewer.open({
                type: 'image',
                url: fileUrl
            });
        }

        // Load the very first slide by default on startup
        loadSlide('https://dropboxusercontent.com');
    </script>
</body>
</html>
